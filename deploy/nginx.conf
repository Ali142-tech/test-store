# /etc/nginx/sites-available/store  (replace shop.example.com and the paths)
server {
    listen 80;
    server_name shop.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name shop.example.com;

    ssl_certificate     /etc/letsencrypt/live/shop.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.example.com/privkey.pem;

    root /var/www/store/current/public;
    index index.php;
    charset utf-8;
    client_max_body_size 8M;   # product images + wholesale documents (app limit is 4 MB)

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Hashed build assets: cache hard. Never cache HTML here (cart/checkout/account pages are private).
    location ^~ /build/ { expires 1y; add_header Cache-Control "public, immutable"; access_log off; }
    location ~* \.(?:jpg|jpeg|png|webp|gif|svg|ico|woff2?)$ { expires 30d; access_log off; }

    # Private files live in storage/app/private and are never served directly.
    location ~ /\.(?!well-known) { deny all; }
    location ~ ^/(storage/app|vendor|\.env) { deny all; }
}
